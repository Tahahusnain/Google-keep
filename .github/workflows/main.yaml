name: CI

on:
  push:
    branches: [master]
env:
  NODE_ENV: production
jobs:
  build:
    if: github.ref == 'refs/heads/master'
    env:
      BUILD_ID: 123
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
  deploy:
    needs: build
    environment: production
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploying"
        if: success()
        env:
          DEPLOY_TARGET: prod
